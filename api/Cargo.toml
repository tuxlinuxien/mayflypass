[package]
name = "api"
version = "1.0.0"
edition = "2024"

[dependencies]
sqlx = { version = "0.9.0", features = ["any", "sqlite", "migrate", "chrono", "json", "runtime-tokio", "tls-rustls", "uuid"] }
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }
uuid = { version = "1.29.2", features = ["serde", "v4", "v7"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
getrandom = "0.4.3"
argon2 = "0.5.3"
axum = {version = "0.8.9", features = ["macros"]}
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
validator = { version = "0.20.0", features = ["derive"] }
axum-test = "21.1.0"
sha2 = "0.11.1"
hex = "0.4.3"
serde_trim = "1.1.0"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
cookie = "0.18.2"
tower-http = { version = "0.7.1", features = ["trace", "cors", "limit"] }
serde_with = { version = "3.24.0", features = ["hex", "json"] }
utoipa = { version = "5", features = ["axum_extras", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
